# =============================================================================
# RotinaXP — CI (Continuous Integration)
# =============================================================================
# Pipeline de validação contínua para branches de feature.
# Roda em qualquer push ou PR que NÃO seja a master (o deploy.yml cuida da master).
#
# Validações:
#   1. TypeScript check  — garante tipagem correta
#   2. Unit tests        — garante que os testes passam
#   3. Build             — garante que o build de produção é gerado sem erros
# =============================================================================

name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches-ignore: [master]

jobs:
  ci:
    name: "🔍 CI — Validate"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 TypeScript type check
        run: npm run typecheck

      - name: 🧪 Run unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: 🏗️ Build
        run: npm run build
        env:
          CI: true
